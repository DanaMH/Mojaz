<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موجز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
         :root {
            --primary: #4b0082;
            /* Indigo */
            --primary-light: #6a3dad;
            --primary-dark: #38006b;
            --accent: #ff7f50;
            /* Coral */
            --text-dark: #333333;
            --text-light: #f8f9fa;
            --background: #f0f2f5;
        }
        
        body {
            font-family: 'Merriweather', serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-color: #0a0a14;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* Advanced background with particles */
        
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0a0320 0%, #170b47 50%, #0e052b 100%);
        }
        
        .cosmic-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.5) 0%, rgba(255, 165, 0, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            filter: blur(30px);
            z-index: -1;
            opacity: 0.9;
            animation: float 10s ease-in-out infinite;
        }
        
        .cosmic-glow:nth-child(1) {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.5) 0%, rgba(0, 255, 255, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
        }
        
        .cosmic-glow:nth-child(2) {
            top: 40%;
            right: 15%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 127, 80, 0.5) 0%, rgba(255, 127, 80, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            animation-delay: -3s;
        }
        
        .cosmic-glow:nth-child(3) {
            bottom: 20%;
            left: 30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(147, 112, 219, 0.5) 0%, rgba(147, 112, 219, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            animation-delay: -6s;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(10px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .logo {
            width: 170px;
            margin-bottom: 20px;
            align-self: flex-start;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }
        
        .title {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--text-light);
            text-align: center;
            text-shadow: 0 0 15px rgba(106, 61, 173, 0.8), 0 0 30px rgba(75, 0, 130, 0.4);
            letter-spacing: 1px;
        }
        
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 0 20px rgba(106, 61, 173, 0.2);
            margin-bottom: 25px;
            border: none;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 25px rgba(106, 61, 173, 0.3);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            color: var(--text-light);
            font-weight: 600;
            padding: 15px 20px;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            padding: 12px 24px;
            color: var(--text-light);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .btn-primary:hover:before {
            left: 100%;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(75, 0, 130, 0.3);
        }
        
        .btn-secondary {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            color: var(--text-light);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-secondary:hover {
            background: #e67348;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(255, 127, 80, 0.3);
        }
        
        .highlighted-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .content-box {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .content-box:hover {
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
        }
        
        .content-box h3 {
            position: sticky;
            top: 0;
            background: #f9f9f9;
            padding: 10px 0;
            margin-top: 0;
            font-size: 18px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary-light);
            z-index: 2;
        }
        
        .highlight {
            background-color: rgba(106, 61, 173, 0.2);
            padding: 0 2px;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }
        
        .no-highlight .highlight {
            background-color: transparent;
        }
        
        .summary-box {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.6;
            direction: rtl;
            text-align: right;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
            margin-right: 10px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked+.slider {
            background-color: var(--primary);
        }
        
        input:checked+.slider:before {
            transform: translateX(24px);
        }
        
        .toggle-label {
            font-size: 16px;
            color: #666;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out forwards;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .highlighted-section {
                grid-template-columns: 1fr;
            }
            .title {
                font-size: 26px;
            }
            .cosmic-glow {
                opacity: 0.7;
            }
        }
        
        .back-button {
            background: linear-gradient(135deg, var(--accent), #e67348);
            border: none;
            padding: 12px 24px;
            color: var(--text-light);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 115, 72, 0.3);
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>

    <div class="cosmic-glow"></div>
    <div class="cosmic-glow"></div>
    <div class="cosmic-glow"></div>

    <div class="notification" id="notification"></div>

    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SDAIA Logo" class="logo">
        <h1 class="title">موجز</h1>

        <a href="/" class="back-button">
            <i class="fas fa-arrow-left"></i> تلخيص نص جديد
        </a>

        <!-- Results Section -->
        <div class="card">
            <div class="card-header">
                <span>الملخص العربي</span>
                <button class="btn-secondary" onclick="copyToClipboard()">
                    <i class="fas fa-copy"></i> نسخ للحافظة
                </button>
            </div>
            <div class="card-body">
                <div class="summary-box" id="arabicSummary">
                    {{ arabic_summary|replace('\n\n', '<br><br>')|safe }}
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>تحليل المحتوى</span>
            </div>
            <div class="highlighted-section">
                <div class="content-box no-highlight" id="highlightedArticleContainer">
                    <h3>النص المظلل</h3>
                    <div id="highlightedArticle">{{ highlighted_article|safe }}</div>
                </div>

                <div class="content-box no-highlight" id="highlightedSummaryContainer">
                    <h3>الملخص المظلل</h3>
                    <div id="highlightedSummary">{{ highlighted_summary|safe }}</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Initialize particles.js for background effect
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": ["#00ffff", "#ff7f50", "#ffa500", "#9370DB", "#ff00ff"]
                    },
                    "shape": {
                        "type": "circle",
                        "stroke": {
                            "width": 0,
                            "color": "#000000"
                        },
                        "polygon": {
                            "nb_sides": 5
                        }
                    },
                    "opacity": {
                        "value": 0.7,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 1,
                            "opacity_min": 0.3,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 4,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 2,
                            "size_min": 0.5,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#00ffff",
                        "opacity": 0.4,
                        "width": 1.5
                    },
                    "move": {
                        "enable": true,
                        "speed": 1.5,
                        "direction": "none",
                        "random": true,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false,
                        "attract": {
                            "enable": false,
                            "rotateX": 600,
                            "rotateY": 1200
                        }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 140,
                            "line_linked": {
                                "opacity": 0.8
                            }
                        },
                        "bubble": {
                            "distance": 400,
                            "size": 40,
                            "duration": 2,
                            "opacity": 8,
                            "speed": 3
                        },
                        "repulse": {
                            "distance": 200,
                            "duration": 0.4
                        },
                        "push": {
                            "particles_nb": 4
                        },
                        "remove": {
                            "particles_nb": 2
                        }
                    }
                },
                "retina_detect": true
            });
        });

        function toggleHighlight() {
            var highlightedArticle = document.getElementById("highlightedArticleContainer");
            var highlightedSummary = document.getElementById("highlightedSummaryContainer");
            highlightedArticle.classList.toggle("no-highlight");
            highlightedSummary.classList.toggle("no-highlight");
        }

        function copyToClipboard() {
            var textToCopy = document.getElementById("arabicSummary").innerText;
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    showNotification("ملخصك جاهز! تم نسخه بنجاح");
                })
                .catch(() => {
                    showNotification("فشل في نسخ النص");
                });
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>

</html>
