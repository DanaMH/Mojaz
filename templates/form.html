<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موجز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
         :root {
            --primary: #4b0082;
            /* Indigo */
            --primary-light: #6a3dad;
            --primary-dark: #38006b;
            --accent: #ff7f50;
            /* Coral */
            --text-dark: #333333;
            --text-light: #f8f9fa;
            --background: #f0f2f5;
        }
        
        body {
            font-family: 'Merriweather', serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-color: #0a0a14;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* Advanced background with particles */
        
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0a0320 0%, #170b47 50%, #0e052b 100%);
        }
        
        .cosmic-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.5) 0%, rgba(255, 165, 0, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            filter: blur(30px);
            z-index: -1;
            opacity: 0.9;
            animation: float 10s ease-in-out infinite;
        }
        
        .cosmic-glow:nth-child(1) {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.5) 0%, rgba(0, 255, 255, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
        }
        
        .cosmic-glow:nth-child(2) {
            top: 40%;
            right: 15%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 127, 80, 0.5) 0%, rgba(255, 127, 80, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            animation-delay: -3s;
        }
        
        .cosmic-glow:nth-child(3) {
            bottom: 20%;
            left: 30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(147, 112, 219, 0.5) 0%, rgba(147, 112, 219, 0.2) 50%, rgba(0, 0, 0, 0) 70%);
            animation-delay: -6s;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(10px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .logo {
            width: 170px;
            margin-bottom: 20px;
            align-self: flex-start;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }
        
        .title {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--text-light);
            text-align: center;
            text-shadow: 0 0 15px rgba(106, 61, 173, 0.8), 0 0 30px rgba(75, 0, 130, 0.4);
            letter-spacing: 1px;
        }
        
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 0 20px rgba(106, 61, 173, 0.2);
            margin-bottom: 25px;
            border: none;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 25px rgba(106, 61, 173, 0.3);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            color: var(--text-light);
            font-weight: 600;
            padding: 15px 20px;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .input-container {
            margin-bottom: 20px;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .form-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(75, 0, 130, 0.1);
        }
        
        textarea.form-input {
            min-height: 200px;
            resize: vertical;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            padding: 12px 24px;
            color: var(--text-light);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .btn-primary:hover:before {
            left: 100%;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(75, 0, 130, 0.3);
        }
        
        .btn-secondary {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            color: var(--text-light);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-secondary:hover {
            background: #e67348;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(255, 127, 80, 0.3);
        }
        
        .login-button {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(75, 0, 130, 0.2);
        }
        
        .login-button:hover {
            background-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(75, 0, 130, 0.4);
        }
        
        .loading-spinner {
            display: none;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(75, 0, 130, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .login-hint {
            display: none;
            position: absolute;
            background-color: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            width: 200px;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: pulse 1.5s ease infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(75, 0, 130, 0.5);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(75, 0, 130, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(75, 0, 130, 0);
            }
        }
        
        .login-hint::after {
            content: "";
            position: absolute;
            top: 100%;
            right: 20px;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: var(--primary) transparent transparent transparent;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out forwards;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        /* Modal styling */
        
        .modal-content {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .modal-header {
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            color: white;
            border-radius: 15px 15px 0 0;
        }
        
        .modal-title {
            font-weight: 600;
        }
        
        .btn-close {
            filter: brightness(0) invert(1);
        }
        
        @media (max-width: 768px) {
            .login-button {
                top: 10px;
                right: 10px;
                font-size: 14px;
                padding: 8px 16px;
            }
            .title {
                font-size: 26px;
                margin-top: 60px;
            }
            .cosmic-glow {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>

    <div class="cosmic-glow"></div>
    <div class="cosmic-glow"></div>
    <div class="cosmic-glow"></div>

    <div class="notification" id="notification"></div>
    <div class="login-hint" id="login-hint">يرجى تسجيل الدخول أولاً لمتابعة التلخيص</div>

    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SDAIA Logo" class="logo">
        <h1 class="title">موجز</h1>

        <button class="login-button" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="fas fa-user"></i> تسجيل الدخول
        </button>

        <!-- Input Form (Always Visible) -->
        <div class="card">
            <div class="card-header">
                <span>تحليل موجز الأخبار</span>
            </div>
            <div class="card-body">
                <form method="POST" action="/" onsubmit="validateInput(event)">
                    <div class="input-container">
                        <textarea name="article" id="article" class="form-input" placeholder="الصق المقال الكامل لتحليل النشرة الإخبارية"></textarea>
                        <div id="article-error" class="error-message">الرجاء إدخال نص مقال صالح للتحليل</div>
                    </div>

                    <div style="text-align: center;">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-brain"></i> تلخيص
                        </button>
                    </div>
                </form>

                <div class="loading-spinner" id="loading-spinner"></div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">تسجيل الدخول</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-input" id="email" placeholder="Enter email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Enter password" required>
                    </div>
                    <div id="login-error" class="error-message">خطأ في البريد الإلكتروني أو كلمة المرور</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" data-bs-dismiss="modal">اغلاق</button>
                    <button type="button" class="btn-primary" onclick="login()">تسجيل الدخول</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Initialize particles.js for background effect
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": ["#00ffff", "#ff7f50", "#ffa500", "#9370DB", "#ff00ff"]
                    },
                    "shape": {
                        "type": "circle",
                        "stroke": {
                            "width": 0,
                            "color": "#000000"
                        },
                        "polygon": {
                            "nb_sides": 5
                        }
                    },
                    "opacity": {
                        "value": 0.7,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 1,
                            "opacity_min": 0.3,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 4,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 2,
                            "size_min": 0.5,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#00ffff",
                        "opacity": 0.4,
                        "width": 1.5
                    },
                    "move": {
                        "enable": true,
                        "speed": 1.5,
                        "direction": "none",
                        "random": true,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false,
                        "attract": {
                            "enable": false,
                            "rotateX": 600,
                            "rotateY": 1200
                        }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 140,
                            "line_linked": {
                                "opacity": 0.8
                            }
                        },
                        "bubble": {
                            "distance": 400,
                            "size": 40,
                            "duration": 2,
                            "opacity": 8,
                            "speed": 3
                        },
                        "repulse": {
                            "distance": 200,
                            "duration": 0.4
                        },
                        "push": {
                            "particles_nb": 4
                        },
                        "remove": {
                            "particles_nb": 2
                        }
                    }
                },
                "retina_detect": true
            });
        });

        // Hide the spinner when page loads
        window.onload = function() {
            document.getElementById('loading-spinner').style.display = 'none';
        };

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === 'Mojz@gmail.com' && password === 'Mojaz@2025@') {
                localStorage.setItem('loggedIn', 'true');
                showNotification('Logged in successfully!');

                // Close modal
                const loginModal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
                loginModal.hide();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function validateInput(event) {
            const articleInput = document.getElementById('article').value.trim();
            const loggedIn = localStorage.getItem('loggedIn');
            const urlRegex = /^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$/;

            // Check if user is logged in
            if (!loggedIn) {
                event.preventDefault();
                const hint = document.getElementById('login-hint');
                const submitButton = document.querySelector('.btn-primary');
                const buttonRect = submitButton.getBoundingClientRect();

                hint.style.top = (buttonRect.top - 60) + 'px';
                hint.style.left = (buttonRect.left + buttonRect.width / 2 - 100) + 'px';
                hint.style.display = 'block';

                setTimeout(() => {
                    hint.style.display = 'none';
                }, 2000);
                return;
            }

            // Validate article input
            if (articleInput === '') {
                document.getElementById('article-error').textContent = 'الرجاء إدخال نص المقال';
                document.getElementById('article-error').style.display = 'block';
                event.preventDefault();
                return;
            } else if (urlRegex.test(articleInput)) {
                document.getElementById('article-error').textContent = 'الرجاء كتابة نص مقال بدلاً من إدخال رابط';
                document.getElementById('article-error').style.display = 'block';
                event.preventDefault();
                return;
            }

            // Store article in session storage for the summary page
            sessionStorage.setItem('articleText', articleInput);

            // Show loading spinner if validation passes
            document.getElementById('loading-spinner').style.display = 'block';
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>

</html>
